<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }

    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #bf2a2a;
      display: inline-block;
      padding-bottom: 5px;
      margin-bottom: 20px;
    }

    /* Inputs and Buttons */
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #bf2a2a;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #a01e1e;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Helper Classes */
    .hidden { display: none; }
    .status { margin-top: 15px; font-size: 12px; color: #666; }
    .label { font-size: 12px; font-weight: bold; margin-bottom: 5px; display: block; text-align: left; margin-left: 5px;}
    .link { color: #888; text-decoration: underline; cursor: pointer; font-size: 11px; }
    .link:hover { color: #bf2a2a; }
    .footer-link { margin-top: 15px; }

    /* --- PING PONG LOADER CSS --- */
    .loader-container {
      width: 100%;
      height: 6px;
      background-color: #e0e0e0;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .loader-bar {
      width: 30%; /* Size of the ping pong ball/bar */
      height: 100%;
      background-color: #bf2a2a;
      position: absolute;
      border-radius: 3px;
      left: 0;
      /* The Ping Pong Animation */
      animation: pingpong 1s ease-in-out infinite alternate;
    }

    @keyframes pingpong {
      0% { left: 0; }
      100% { left: 70%; } /* 100% container - 30% bar width = 70% */
    }
  </style>
</head>
<body>
  <h3>Reddeye Profiler</h3>

  <!-- VIEW 1: SETUP (Input API Key) -->
  <div id="setup-view" class="hidden">
    <label class="label">Enter Groq API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="gsk_..." />
    <button id="saveKeyBtn">Save Credentials</button>
    <div class="status">
      <a href="https://console.groq.com/keys" target="_blank" style="color:#666;">Get key from console.groq.com</a>
    </div>
  </div>

  <!-- VIEW 2: MAIN (Generate Button) -->
  <div id="main-view" class="hidden">
    <!-- The Action Button -->
    <button id="generateBtn">INITIATE ANALYSIS</button>

    <!-- The Loading Animation (Hidden by default) -->
    <div id="loading-section" class="hidden">
      <div class="loader-container">
        <div class="loader-bar"></div>
      </div>
      <div class="status">Extracting Intelligence...</div>
    </div>

    <!-- Reset Link -->
    <div class="footer-link">
      <span class="link" id="resetKey">Reset API Key</span>
    </div>
  </div>

  <!-- VIEW 3: ERROR (Wrong Page) -->
  <div id="error-view" class="hidden">
    <div class="status" style="color:#a01e1e; font-weight:bold;">
      Target Not Found.
    </div>
    <div class="status">
      Please navigate to a Reddit user profile page to begin extraction.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
